<script>
  (() => {
    const selector = 'script[data-pattern-runtime-loader]';

    if (window.PatternRuntime?.version) {
      window.PatternRuntime.scan(document);
      return;
    }

    if (document.querySelector(selector)) return;

    const script = document.createElement('script');
    script.src =
      'https://cdn.jsdelivr.net/gh/blackpixelca/pattern@1d66a6f2759e822992a001906a013ec5790c35e9/webflow/pattern.com/scripts/runtime/pattern-runtime.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.integrity =
      'sha384-0r2H7c55olwdPtptV/5Gf4aeMU78eKgPBC0EzVqkxwQbwFG30ytACl3GLADFEPic';
    script.dataset.patternRuntimeLoader = '0.1.0';
    script.addEventListener(
      'error',
      () => {
        console.warn(
          '[Pattern Runtime] The hosted runtime could not load. Static Webflow content remains available.',
        );
      },
      { once: true },
    );

    document.head.appendChild(script);
  })();
</script>
