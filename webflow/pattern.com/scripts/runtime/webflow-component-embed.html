<script>
  (() => {
    const selector = 'script[data-pattern-runtime-loader]';

    if (window.PatternRuntime?.version) {
      window.PatternRuntime.scan(document);
      return;
    }

    if (document.querySelector(selector)) return;

    const script = document.createElement('script');
    script.src =
      'https://cdn.jsdelivr.net/gh/specterstudio/pattern@d1e10cf719a75af11952b3d1b3a6a683b99fe164/webflow/pattern.com/scripts/runtime/pattern-runtime.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.integrity =
      'sha384-SsWlxDgw0ZZu2i76RT/iFOnvbvgSsrAk7FgUf9sdlffOfszKy4GLPACXNazadrnn';
    script.dataset.patternRuntimeLoader = '0.1.1';
    script.addEventListener(
      'error',
      () => {
        console.warn(
          '[Pattern Runtime] The hosted runtime could not load. Static Webflow content remains available.',
        );
      },
      { once: true },
    );

    document.head.appendChild(script);
  })();
</script>
