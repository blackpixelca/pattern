<!--
  Pattern Version Gateway V3 activation loader.

  This release activates PVG only on explicitly marked V3 pages. V1, V2, and
  V2L keep their existing production scripts because legacyPolicy="preserve".

  Keep the current legacy footer scripts installed during this release.
-->
<script>
  (() => {
    const selector = 'script[data-pattern-pvg-loader]';
    const activate = () =>
      window.PatternVersionGateway?.activate({
        legacyPolicy: 'preserve',
      });

    if (window.PatternVersionGateway?.version) {
      void activate();
      return;
    }

    const pending = document.querySelector(selector);
    if (pending) {
      pending.dataset.pvgMode = 'active';
      pending.dataset.pvgLegacyPolicy = 'preserve';
      pending.addEventListener('load', activate, { once: true });
      return;
    }

    const script = document.createElement('script');
    script.src =
      'https://cdn.jsdelivr.net/gh/specterstudio/pattern@6613c50d4bf6d9a40b4b88ee64f792822fdc8f9d/webflow/pattern.com/scripts/runtime/pattern-version-gateway.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.integrity =
      'sha384-7i5I05dfqsOHQEK5w2uS1c0du20+Xudps73oORQfwGB5Qb9BGi1jhhCru+3NcEQj';
    script.dataset.patternPvgLoader = '0.2.1';
    script.dataset.pvgMode = 'active';
    script.dataset.pvgLegacyPolicy = 'preserve';
    script.addEventListener(
      'error',
      () => {
        console.warn(
          '[Pattern PVG] The V3 runtime could not load. Existing production scripts remain unchanged.',
        );
      },
      { once: true },
    );

    document.head.appendChild(script);
  })();
</script>
