<!--
  Pattern Version Gateway background loader.

  This template is intentionally observation-only. Replace PVG_COMMIT_SHA
  before installing it on a safe Webflow staging surface.

  Keep all existing production footer scripts in place while mode="observe".
-->
<script>
  (() => {
    const selector = 'script[data-pattern-pvg-loader]';

    if (window.PatternVersionGateway?.version) {
      window.PatternVersionGateway.scan(document);
      return;
    }

    if (document.querySelector(selector)) return;

    const script = document.createElement('script');
    script.src =
      'https://cdn.jsdelivr.net/gh/specterstudio/pattern@PVG_COMMIT_SHA/webflow/pattern.com/scripts/runtime/pattern-version-gateway.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.integrity =
      'sha384-IFnTnwnuhTQuZgkmTwEt8cn/1ZCIfdjU8C93w7nquFPsKt9b5zLZV7QreGNoY2Nm';
    script.dataset.patternPvgLoader = '0.1.0';
    script.dataset.pvgMode = 'observe';
    script.addEventListener(
      'error',
      () => {
        console.warn(
          '[Pattern PVG] The observation runtime could not load. Existing production scripts remain unchanged.',
        );
      },
      { once: true },
    );

    document.head.appendChild(script);
  })();
</script>
