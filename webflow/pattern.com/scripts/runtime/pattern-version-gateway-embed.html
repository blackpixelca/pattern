<!--
  Pattern Version Gateway background loader.

  This template is intentionally observation-only and pins the verified PVG
  runtime commit for installation on a safe Webflow staging surface.

  Keep all existing production footer scripts in place while mode="observe".
-->
<script>
  (() => {
    const selector = 'script[data-pattern-pvg-loader]';

    if (window.PatternVersionGateway?.version) {
      window.PatternVersionGateway.scan(document);
      return;
    }

    if (document.querySelector(selector)) return;

    const script = document.createElement('script');
    script.src =
      'https://cdn.jsdelivr.net/gh/specterstudio/pattern@f3164750f528a7559dac0b2654bc6f353f1869e9/webflow/pattern.com/scripts/runtime/pattern-version-gateway.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.integrity =
      'sha384-W4P5u+brx9UjrgBDRChxOPqIVxiGmvmawgCMwSmqj9PcDgEsQDbYsKKMs/IU4e44';
    script.dataset.patternPvgLoader = '0.2.0';
    script.dataset.pvgMode = 'observe';
    script.addEventListener(
      'error',
      () => {
        console.warn(
          '[Pattern PVG] The observation runtime could not load. Existing production scripts remain unchanged.',
        );
      },
      { once: true },
    );

    document.head.appendChild(script);
  })();
</script>
